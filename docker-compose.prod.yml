services:

  # ==========================================
  # FRONTEND
  # ==========================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: skill-booking-frontend

    restart: unless-stopped

    env_file:
      - ./frontend/.env.docker

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      backend:
        condition: service_started

    networks:
      - app-network


  # ==========================================
  # BACKEND
  # ==========================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: skill-booking-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env.docker

    ports:
      - "127.0.0.1:4000:4000"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - app-network


  # ==========================================
  # POSTGRESQL
  # ==========================================

  db:
    image: postgres:15-alpine

    container_name: skill-booking-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bookmyskill

    volumes:
      - postgres-data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d bookmyskill"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - app-network


  # ==========================================
  # REDIS
  # ==========================================

  redis:
    image: redis:7-alpine

    container_name: skill-booking-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    expose:
      - "6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - app-network


# ==========================================
# PERSISTENT VOLUMES
# ==========================================

volumes:

  postgres-data:
    driver: local

  redis-data:
    driver: local


# ==========================================
# INTERNAL NETWORK
# ==========================================

networks:

  app-network:
    driver: bridge