version: "3.9"

services:
  backend:
    image: ghcr.io/agentic-luna/skill-booking-backend:latest
    container_name: backend

    restart: unless-stopped

    env_file:
      - ./backend/.env.docker

    ports:
      - "127.0.0.1:4000:4000"

    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - backend-network

  db:
    image: postgres:15-alpine
    container_name: postgres_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookmyskill

    volumes:
      - postgres-data:/var/lib/postgresql/data

    expose:
      - "5432"

    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    container_name: redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    expose:
      - "6379"

    networks:
      - backend-network

volumes:
  postgres-data:
  redis-data:

networks:
  backend-network:
    driver: bridge