services:

  # ==========================================
  # BACKEND
  # ==========================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: backend

    restart: unless-stopped

    ports:
      - "127.0.0.1:4000:4000"

    env_file:
      - ./backend/.env.docker

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend-network


  # ==========================================
  # POSTGRESQL
  # ==========================================

  db:
    image: postgres:15-alpine

    container_name: postgres_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookmyskill

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookmyskill"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - backend-network


  # ==========================================
  # REDIS
  # ==========================================

  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - backend-network


  # ==========================================
  # VOLUMES
  # ==========================================

volumes:
  postgres-data:
  redis-data:


  # ==========================================
  # NETWORK
  # ==========================================

networks:
  backend-network:
    driver: bridge