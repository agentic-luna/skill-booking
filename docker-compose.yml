services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host

    container_name: backend

    restart: unless-stopped

    ports:
      - "4000:4000"

    env_file:
      - ./backend/.env.docker

    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started

    networks:
      - backend-network

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookmyskill
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network

  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - backend-network

volumes:
  redis-data:
  postgres-data:

networks:
  backend-network:
    driver: bridge